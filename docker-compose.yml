name: music-bot

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: music-lavalink
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    env_file: .env
    environment:
      LAVALINK_JAVA_OPTS: "-Xmx768m -XX:+UseG1GC"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/entrypoint.sh:/entrypoint.sh:ro
      # владелец каталогов — uid 322 (пользователь lavalink в образе), см. scripts/setup.sh
      - ./lavalink/plugins:/opt/Lavalink/plugins
      - ./lavalink/logs:/opt/Lavalink/logs
    ports:
      - "127.0.0.1:2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -H \"Authorization: $$LAVALINK_PASSWORD\" http://localhost:2333/version || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      - yt-cipher
      - spotify-tokener
    mem_limit: 1200m

  # Расшифровка подписей YouTube (https://github.com/kikkia/yt-cipher)
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: music-yt-cipher
    restart: unless-stopped
    environment:
      API_TOKEN: "${YT_CIPHER_TOKEN}"
      OVERRIDE_PLAYER_VARIANT: "IAS"
      MAX_THREADS: "1"
      PREPROCESSED_CACHE_SIZE: "50"
    mem_limit: 400m

  # Анонимные токены Spotify без аккаунта разработчика (https://github.com/topi314/spotify-tokener)
  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: music-spotify-tokener
    restart: unless-stopped
    mem_limit: 512m

  # Мост SoundCloud: новые треки (AAC HLS) качает yt-dlp и отдаёт Lavalink обычным файлом
  sc-bridge:
    build: ./sc-bridge
    container_name: music-sc-bridge
    restart: unless-stopped
    environment:
      CACHE_MB: "1024"
    volumes:
      - ./sc-cache:/cache
    mem_limit: 400m

  bot:
    build: ./bot
    container_name: music-bot
    restart: unless-stopped
    env_file: .env
    environment:
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: "2333"
      PANEL_PORT: "8090"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${PANEL_HOST_PORT:-8090}:8090"
    depends_on:
      lavalink:
        condition: service_healthy
    mem_limit: 400m
